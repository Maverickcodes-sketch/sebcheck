<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:Segoe UI,Arial,sans-serif;background:#f4f6f8;color:#1b2430}
  .box{text-align:center}
  a.btn{display:inline-block;margin:10px;padding:16px 32px;border-radius:8px;
        text-decoration:none;color:#fff;font-size:18px}
  .cc{background:#2557d6}.gpt{background:#10a37f}
  p{color:#667}
</style>
</head>
<body>
  <div class="box">
    <h2>Choose a site</h2>
    <a class="btn cc" href="https://codecoliseum.in/" target="_blank">CodeColiseum</a>
    <a class="btn gpt" href="https://chatgpt.com/" target="_blank">ChatGPT</a>
    <p>Each link opens in its own window. Close it or use the taskbar to switch back.</p>
  </div>
</body>
</html>
